<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>首页方案 · 铂寻 Boseek</title>
    <link rel="stylesheet" href="../landing/shared-ui.css" />
    <link
      rel="stylesheet"
      href="shared-homepage-catalog.css?v=20261010-options-a"
    />
    <script defer src="../landing/shared-ui.js"></script>
    <script defer src="shared-homepage-catalog.js"></script>
  </head>
  <body>
    <a class="f-skip" href="#main">跳到主要内容</a>
    <header class="h-header">
      <div class="f-container">
        <a class="f-brand" href="../" aria-label="Boseek 铂寻原首页">
          <img
            src="../landing/assets/boseek-wordmark.svg"
            alt="Boseek 铂寻"
            width="187"
            height="187"
          />
        </a>
        <span>HunterBuddy</span>
      </div>
    </header>
    <main id="main" class="f-container h-catalog">
      <div class="h-heading">
        <h1>首页方案</h1>
        <span>4 个版本</span>
      </div>
      <div class="h-options">
        <a class="h-option" href="../" title="打开原版首页">
          <img
            src="assets/original.png"
            alt="原版首页实际画面"
            width="1280"
            height="800"
          />
          <div class="h-option-label">
            <h2>原版首页</h2>
            <span data-catalog-icon aria-hidden="true"></span>
          </div>
        </a>
        <a class="h-option" href="../landing-signal/" title="打开蓝白编辑版">
          <img
            src="assets/signal.png"
            alt="蓝白编辑版实际画面"
            width="1280"
            height="800"
          />
          <div class="h-option-label">
            <h2>蓝白编辑版</h2>
            <span data-catalog-icon aria-hidden="true"></span>
          </div>
        </a>
        <a class="h-option" href="../landing/" title="打开第二版首页">
          <img
            src="assets/finesse.png"
            alt="第二版首页实际画面"
            width="1280"
            height="800"
            loading="lazy"
          />
          <div class="h-option-label">
            <h2>第二版首页</h2>
            <span data-catalog-icon aria-hidden="true"></span>
          </div>
        </a>
        <a class="h-option" href="../landing-origin/" title="打开第三版首页">
          <img
            src="assets/origin.png"
            alt="深色第三版实际画面"
            width="1280"
            height="800"
            loading="lazy"
          />
          <div class="h-option-label">
            <h2>第三版首页</h2>
            <span data-catalog-icon aria-hidden="true"></span>
          </div>
        </a>
      </div>
    </main>
    <footer class="f-container h-footer">北京铂寻智能科技有限公司</footer>
  </body>
</html>
