<!doctype html>
<html lang="zh-CN">

    <link rel="stylesheet" href="../landing/shared-ui.css" />

    <header class="h-header">

            src="../landing/assets/boseek-wordmark.svg"
            alt="Boseek 铂寻"

          />

          title="在新标签页打开第一版首页"

            height="800"
